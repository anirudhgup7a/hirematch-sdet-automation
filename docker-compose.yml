# ═══════════════════════════════════════════════════════════
#  HireMatch SDET Automation — Docker Compose
# ═══════════════════════════════════════════════════════════
#  Usage:
#    docker compose up --build      → Start API + Frontend
#    docker compose --profile test up → Run full test suite
# ═══════════════════════════════════════════════════════════

version: "3.9"

services:
  # ─────────── Backend API ───────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirematch-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./hirematch.db
    volumes:
      - ./hirematch.db:/app/hirematch.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─────────── Frontend ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hirematch-ui
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─────────── Test Runner (on-demand) ───────────
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: hirematch-tests
    profiles: ["test"]
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - UI_BASE_URL=http://frontend:80
      - DATABASE_URL=sqlite:///./hirematch.db
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
