[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html
    --capture=sys

markers =
    smoke: Critical path smoke tests for sanity checks
    regression: Comprehensive regression test suite
    api: REST API endpoint automation tests
    ui: Playwright browser end-to-end UI automation tests
    integration: Multi-persona end-to-end integration workflows
    negative: Negative testing, validation errors, and boundary checks
    security: Role-based authorization and token validation tests
    data_driven: Parametrized data-driven tests
